name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The forge holds main and GitHub mirrors it. The secret scan runs on both; the build needs Windows
# (net10.0-windows, WPF) and the forge has no Windows runner, so it runs on GitHub only.
jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action reads the owner's account type through GitHub's API and demands a paid license
      # when it cannot tell; the forge's owner has no such type. Both servers run the release binary,
      # pinned by digest, over the whole history.
      - name: gitleaks
        timeout-minutes: 10
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  build-test:
    name: Build and test
    if: github.server_url == 'https://github.com'
    # The forge has no Windows runner; a label it lacks waits there even when skipped.
    runs-on: ${{ github.server_url == 'https://github.com' && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore CredVault.sln
      - run: dotnet build CredVault.sln --configuration Release --no-restore
      - run: dotnet test CredVault.sln --configuration Release --no-build --verbosity normal
